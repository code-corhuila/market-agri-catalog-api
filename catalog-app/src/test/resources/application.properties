# Unit and HTTP tests run without a database: the pool points to an address nobody listens on,
# so readiness reports the database DOWN. The integration tests replace the URL (CatalogPersistenceIT).
spring.datasource.url=jdbc:postgresql://localhost:1/unreachable
spring.datasource.username=catalog_app
spring.datasource.password=unused
# The issuer of auth (ADR-020); the public key comes from CatalogSpringTest, generated per run.
jwt.issuer=market-agri-auth
